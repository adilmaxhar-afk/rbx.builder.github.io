<!DOCTYPE html>
<html>
<head>
  <title>Roblox Idea Hub</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: linear-gradient(270deg, #ff6ec4, #7873f5, #42e695);
      background-size: 600% 600%;
      animation: gradient 10s ease infinite;
      color: white;
    }

    @keyframes gradient {
      0% {background-position: 0%}
      50% {background-position: 100%}
      100% {background-position: 0%}
    }

    .box {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      margin: 30px auto;
      width: 320px;
      border-radius: 15px;
    }

    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      cursor: pointer;
    }

    #chatBox {
      height: 200px;
      overflow-y: auto;
      background: black;
      padding: 10px;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

<h1>🎮 Roblox Idea Hub</h1>

<!-- IDEA FORM -->
<div class="box">
  <h3>💡 Submit Your Idea</h3>
  <input id="ideaName" placeholder="Your Name"><br>
  <input id="gameName" placeholder="Game Name"><br>
  <textarea id="ideaText" placeholder="Your Game Idea"></textarea><br>
  <button onclick="sendIdea()">Send Idea</button>
</div>

<!-- CHAT -->
<div class="box">
  <h3>💬 Live Chat</h3>

  <div id="chatBox"></div>

  <input id="username" placeholder="Your Name"><br>
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- FIREBASE (FIXED VERSION) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "PUT_YOUR_API_KEY",
  authDomain: "PUT_YOUR_PROJECT.firebaseapp.com",
  projectId: "PUT_YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// SEND IDEA
function sendIdea() {
  const name = document.getElementById("ideaName").value;
  const game = document.getElementById("gameName").value;
  const idea = document.getElementById("ideaText").value;

  if (!name || !game || !idea) {
    alert("Fill everything bro 😅");
    return;
  }

  db.collection("ideas").add({
    name: name,
    game: game,
    idea: idea,
    time: Date.now()
  });

  alert("Idea sent 🚀");

  document.getElementById("ideaName").value = "";
  document.getElementById("gameName").value = "";
  document.getElementById("ideaText").value = "";
}


// SEND MESSAGE
function sendMessage() {
  const name = document.getElementById("username").value;
  const msg = document.getElementById("message").value;

  if (!name || !msg) return;

  db.collection("messages").add({
    name: name,
    message: msg,
    time: Date.now()
  });

  document.getElementById("message").value = "";
}


// REAL-TIME CHAT (FIXED)
db.collection("messages")
  .orderBy("time")
  .onSnapshot(snapshot => {
    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";

    snapshot.forEach(doc => {
      const data = doc.data();
      chatBox.innerHTML += `<p><b>${data.name}:</b> ${data.message}</p>`;
    });

    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

</body>
</html>
<script>
// Ask permission
if (Notification.permission !== "granted") {
  Notification.requestPermission();
}
</script>
<script>
let lastIdeaTime = 0;

db.collection("ideas")
  .orderBy("time")
  .onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {

      if (change.type === "added") {
        const data = change.doc.data();

        // prevent old messages triggering
        if (data.time > lastIdeaTime) {
          lastIdeaTime = data.time;

          showNotification(data);
        }
      }

    });
});
</script>
<script>
function showNotification(data) {
  if (Notification.permission === "granted") {
    new Notification("🔥 New Roblox Idea!", {
      body: data.name + " submitted: " + data.game
    });
  }
}
</script>
